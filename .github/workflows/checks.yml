name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  product-agnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/lighthouse/checks/check-no-localhost.js
      - run: node scripts/lighthouse/checks/check-product-agnostic.js
