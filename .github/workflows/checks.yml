name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  product-agnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node apps/delivery-ops/scripts/check-no-localhost.js
      - run: node apps/delivery-ops/scripts/check-product-agnostic.js
      - run: node apps/delivery-ops/scripts/check-no-hardcoded-colors.js
        continue-on-error: true # warn-only until 2740 → 0
