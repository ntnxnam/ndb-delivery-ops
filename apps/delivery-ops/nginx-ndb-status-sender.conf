# Nginx config for NDB Status Sender (install to /etc/nginx/conf.d/ndb-status-sender.conf on server)
# App path must match SERVER_PATH in deploy-to-production.sh
# Note: localhost below is correct — nginx and Node run on the same host. Port 6001 must match backend PORT (or set via env in ecosystem.config.js).
server {
    listen 6100;
    server_name _;

    client_max_body_size 10M;

    location /api {
        proxy_pass http://localhost:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        root /var/www/html/ndb-status-sender/client/build;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    location /api/health {
        proxy_pass http://localhost:6001/api/health;
        access_log off;
    }
}
