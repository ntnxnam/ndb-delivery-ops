<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NDB Release Schedule 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #fff;
    color: #111;
    padding: 40px 48px 48px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 36px;
    border-bottom: 1.5px solid #111;
    padding-bottom: 12px;
  }
  header h1 { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
  header p  { font-size: 11px; color: #888; margin-top: 3px; }

  #download-btn {
    background: #111; color: #fff;
    border: none; padding: 7px 14px;
    font-size: 11px; font-weight: 600;
    letter-spacing: 0.4px; text-transform: uppercase;
    cursor: pointer; border-radius: 3px;
  }
  #download-btn:hover { background: #333; }

  /* Legend */
  #legend {
    display: flex; gap: 20px;
    margin-bottom: 28px;
    font-size: 10px; color: #555;
    flex-wrap: wrap;
  }
  .leg { display: flex; align-items: center; gap: 5px; }
  .leg-dot {
    width: 7px; height: 7px; border-radius: 50%;
    border: 1.5px solid #111;
    flex-shrink: 0;
  }
  .leg-dot.filled { background: #111; }
  .leg-today { width: 1.5px; height: 12px; background: #bbb; }

  /* Month ruler */
  #ruler {
    position: relative;
    margin-left: 90px;
    height: 18px;
    margin-bottom: 4px;
  }
  .month-tick {
    position: absolute;
    top: 0;
    font-size: 9px;
    color: #aaa;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    transform: translateX(-50%);
    white-space: nowrap;
  }
  .month-tick::before {
    content: '';
    display: block;
    width: 1px;
    height: 5px;
    background: #ddd;
    margin: 0 auto 2px;
  }

  /* Chart area */
  #chart { position: relative; }

  /* Today line */
  .today-vline {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: #ccc;
    pointer-events: none;
    z-index: 1;
  }
  .today-vline::before {
    content: 'TODAY';
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 8px;
    color: #aaa;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  /* Each release row */
  .rel-row {
    display: flex;
    align-items: center;
    margin-bottom: 22px;
    position: relative;
  }
  .rel-label {
    width: 90px;
    flex-shrink: 0;
    padding-right: 14px;
    text-align: right;
  }
  .rel-name { font-size: 12px; font-weight: 700; }
  .rel-type { font-size: 9px; color: #aaa; margin-top: 1px; text-transform: uppercase; letter-spacing: 0.3px; }

  .rel-track {
    flex: 1;
    position: relative;
    height: 28px;
  }
  /* The spine line */
  .spine {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    height: 1px;
    background: #ddd;
  }
  /* Gate dot */
  .gdot {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    z-index: 3;
    cursor: default;
  }
  /* Tooltip */
  .gdot:hover::after {
    content: attr(data-tip);
    position: absolute;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    color: #fff;
    padding: 3px 7px;
    border-radius: 3px;
    font-size: 10px;
    white-space: nowrap;
    z-index: 20;
    pointer-events: none;
    font-family: 'Helvetica Neue', sans-serif;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>NDB Release Schedule — 2026</h1>
    <p>Gate timeline ordered by GA date &nbsp;·&nbsp; Updated 02-Jul-2026 &nbsp;·&nbsp; Patch &amp; Maintenance: CC + GA only</p>
  </div>
  <button id="download-btn" onclick="downloadPng()">↓ Export PNG</button>
</header>

<div id="legend">
  <div class="leg"><div class="leg-dot"></div> CC / Payload Req</div>
  <div class="leg"><div class="leg-dot filled" style="background:#aaa;border-color:#aaa"></div> EC / Commit</div>
  <div class="leg"><div class="leg-dot filled"></div> Code Complete</div>
  <div class="leg"><div class="leg-dot filled"></div> CG / Manual Testing</div>
  <div class="leg"><div class="leg-dot filled"></div> Branch Cut</div>
  <div class="leg"><div class="leg-dot filled"></div> PG / Automation</div>
  <div class="leg"><div class="leg-dot filled" style="background:#111;width:9px;height:9px"></div> GA</div>
  <div class="leg"><div class="leg-today"></div> Today</div>
</div>

<div id="ruler"></div>
<div id="chart"></div>

<script>
// Sorted by GA date
// Patch (3 dots) and Maintenance (2 dots): CC + GA only per cadence rules
// Major (1 dot): full gate model
const releases = [
  { name:'2.10.1.3', type:'patch',       cc:'2026-07-01', ga:'2026-07-21', gaNote:'Approved exception: GA moved from 2026-07-15 (+6d)' },
  { name:'2.11',     type:'major',       ccReq:'2025-11-18', ec:'2025-12-09', cc:'2026-01-30', cg:'2026-04-14', bc:'2026-04-28', pg:'2026-05-12', ga:'2026-07-28' },
  { name:'2.11.0.1', type:'patch',       cc:'2026-08-05', ga:'2026-08-19' },
  { name:'2.11.1',   type:'maintenance', cc:'2026-08-19', ga:'2026-09-16' },
  { name:'2.11.1.1', type:'patch',       cc:'2026-10-07', ga:'2026-10-21' },
  { name:'2.11.1.2', type:'patch',       cc:'2026-11-04', ga:'2026-11-18' },
  { name:'2.12',     type:'major',       ccReq:'2026-04-22', ec:'2026-05-12', cc:'2026-07-06', cg:'2026-08-18', bc:'2026-09-08', pg:'2026-09-29', ga:'2026-11-19' },
  { name:'2.12.0.1', type:'patch',       cc:'2026-12-02', ga:'2026-12-16' },
];

const T_START = new Date('2025-11-01');
const T_END   = new Date('2026-12-31');
const SPAN    = (T_END - T_START) / 864e5;

const LABELS = { ccReq:'CC / Payload Req', ec:'EC / Commit', cc:'Code Complete', cg:'CG / Manual Testing', bc:'Branch Cut', pg:'PG / Automation', ga:'GA' };

function d(s) { return new Date(s + 'T00:00:00'); }
function pct(s) { return Math.max(0, Math.min(100, ((d(s) - T_START) / 864e5 / SPAN) * 100)); }
function fmt(s) { return d(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }

// Dot sizes & styles per gate
const DOT = {
  ccReq: { r:4,  fill:'none',  stroke:'#111', sw:1.5 },
  ec:    { r:4,  fill:'#bbb',  stroke:'#bbb', sw:1.5 },
  cc:    { r:5,  fill:'#111',  stroke:'#111', sw:1.5 },
  cg:    { r:4,  fill:'#111',  stroke:'#111', sw:1.5 },
  bc:    { r:4,  fill:'#111',  stroke:'#111', sw:1.5 },
  pg:    { r:4,  fill:'#111',  stroke:'#111', sw:1.5 },
  ga:    { r:6,  fill:'#111',  stroke:'#111', sw:2   },
};

// Gates shown per release type
const GATES_FOR_TYPE = {
  major:       ['ccReq','ec','cc','cg','bc','pg','ga'],
  maintenance: ['cc','ga'],
  patch:       ['cc','ga'],
};

// ── Month ruler ──
(function() {
  const ruler = document.getElementById('ruler');
  const cur = new Date(T_START); cur.setDate(1);
  while (cur <= T_END) {
    const p = ((cur - T_START) / 864e5 / SPAN) * 100;
    const tick = document.createElement('div');
    tick.className = 'month-tick';
    tick.style.left = p + '%';
    tick.textContent = cur.toLocaleDateString('en-US',{month:'short',year:'2-digit'});
    ruler.appendChild(tick);
    cur.setMonth(cur.getMonth() + 1);
  }
})();

// ── Today line ──
(function() {
  const chart = document.getElementById('chart');
  const tp = pct(new Date().toISOString().slice(0,10));
  const line = document.createElement('div');
  line.className = 'today-vline';
  line.style.left = 'calc(90px + ' + tp + '% * (100% - 90px) / 100)';
  chart.appendChild(line);
})();

// ── Rows ──
releases.forEach(rel => {
  const gates = GATES_FOR_TYPE[rel.type] || GATES_FOR_TYPE.major;
  const spineStart = rel[gates[0]];
  const spineEnd   = rel.ga;

  const row = document.createElement('div');
  row.className = 'rel-row';

  const lbl = document.createElement('div');
  lbl.className = 'rel-label';
  lbl.innerHTML = `<div class="rel-name">NDB-${rel.name}</div><div class="rel-type">${rel.type}</div>`;
  row.appendChild(lbl);

  const track = document.createElement('div');
  track.className = 'rel-track';

  // Spine between first and last gate for this release type
  const spine = document.createElement('div');
  spine.className = 'spine';
  spine.style.left  = pct(spineStart) + '%';
  spine.style.width = (pct(spineEnd) - pct(spineStart)) + '%';
  track.appendChild(spine);

  // Gate dots — only gates relevant to this release type
  gates.forEach(g => {
    if (!rel[g]) return;
    const cfg = DOT[g];
    const dot = document.createElement('div');
    dot.className = 'gdot';
    let tip = `${LABELS[g]}  ·  ${fmt(rel[g])}`;
    if (g === 'ga' && rel.gaNote) tip += `  ·  ${rel.gaNote}`;
    dot.style.cssText = `
      left: ${pct(rel[g])}%;
      width:  ${cfg.r*2}px;
      height: ${cfg.r*2}px;
      background: ${cfg.fill === 'none' ? 'transparent' : cfg.fill};
      border: ${cfg.sw}px solid ${cfg.stroke};
    `;
    dot.setAttribute('data-tip', tip);
    track.appendChild(dot);
  });

  row.appendChild(track);
  document.getElementById('chart').appendChild(row);
});

function downloadPng() {
  const btn = document.getElementById('download-btn');
  btn.textContent = '...'; btn.disabled = true;
  html2canvas(document.body, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(c => {
    const a = document.createElement('a');
    a.download = 'NDB-Release-Schedule-2026.png';
    a.href = c.toDataURL('image/png');
    a.click();
    btn.textContent = '↓ Export PNG'; btn.disabled = false;
  });
}
</script>
</body>
</html>
